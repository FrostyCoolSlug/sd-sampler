[package]
name = "sd-sampler"
version = "0.1.0"
edition = "2024"

description = "Sampler plugin for OpenDeck on Linux, inspired by the GoXLR"

[dependencies]
### Logging ###
log = "0.4"
simplelog = "0.12"

### Error Handling ###
anyhow = "1"

### TokIO ###
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

### Serialsing / Deserialsing Settings ###
serde = { version = "1", features = ["derive"] }
serde_json = "1"

### Directory Handling ###
directories = "6.0"

### Stream Deck ###
openaction = "2.7.0"

### Utility Crates
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
fastrand = "2.5.0"
walkdir = "2"
rfd = "0.18.0"
open = "5.4.4"
base64 = "0.23.1"

### Audio File Handling
hound = "3.5"
ebur128 = "0.1"
rb = "0.4"
atomic_float = "1"
rubato = "5.0"
symphonia = { version = "0.6", default-features = false, features = ["wav", "ogg", "flac", "vorbis", "pcm", "mp3", "all-meta"] }

### PulseAudio Handlers
cpal = "0.18.2"

[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18.2", features = ["pulseaudio"] }