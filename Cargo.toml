[package]
name = "sd-sampler"
version = "0.1.0"
edition = "2024"

description = "Sampler plugin for OpenDeck on Linux, inspired by the GoXLR"

[dependencies]
### Logging ###
log = "0.4"
simplelog = "0.12"

### Error Handling ###
anyhow = "1"

### TokIO ###
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

### Serialsing / Deserialsing Settings ###
serde = { version = "1", features = ["derive"] }
serde_json = "1"

### Directory Handling ###
directories = "6.0"

### Stream Deck ###
openaction = "2.7.0"

### PulseAudio Handlers
cpal = { version = "0.18.2", features = ["pulseaudio"]}