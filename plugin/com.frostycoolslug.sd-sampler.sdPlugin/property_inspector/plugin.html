<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="color-scheme" content="dark">
    <title>Sample Pad</title>

    <script src="../sdpi/sdpi-components.js"></script>
    <style>
    </style>
</head>
<body>
<sdpi-heading>Plugin</sdpi-heading>

<sdpi-item label="Record from">
    <sdpi-select setting="record_source" datasource="getSources" hot-reload show-refresh loading="Loading…"></sdpi-select>
</sdpi-item>

<sdpi-item label="Play to">
    <sdpi-select setting="playback_sinks" datasource="getSinks" hot-reload show-refresh loading="Loading…"></sdpi-select>
</sdpi-item>

<sdpi-item label="Pre-buffer">
    <sdpi-range global setting="pre_buffer_ms" min="0" max="30000" step="100" default="0" showlabels></sdpi-range>
</sdpi-item>

<sdpi-item label="Samples folder">
    <sdpi-textfield global setting="samples_directory" placeholder="~/.local/share/opendeck-sampler/samples" hot-reload></sdpi-textfield>
</sdpi-item>

<script>

</script>
</body>
</html>
